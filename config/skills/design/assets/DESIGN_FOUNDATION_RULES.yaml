# ==============================================================================
# DESIGN FOUNDATION RULES (HỆ THỐNG QUY TẮC THIẾT KẾ BẮT BUỘC KIỂM CHỨNG)
# Tri thức đúc kết từ 10 kho lưu trữ P0/P1/P2
# ==============================================================================
version: "1.0"
description: "Testable visual & typographic rules for Antigravity automated code audits"

rules:
  # ----------------------------------------------------------------------------
  # NHÓM 1: TYPOGRAPHY INTELLIGENCE (UTOPIA + WE落TYPOGRAPHY + CAPSIZE)
  # ----------------------------------------------------------------------------
  - id: "TYPE-001"
    name: "fluid_type_clamp"
    category: "typography"
    source: "utopia-core"
    severity: "CRITICAL"
    condition: "font_size_declaration"
    requirement: "All root and heading font sizes must use fluid clamp() interpolation between defined minimum (320px) and maximum (1240px+) viewports instead of arbitrary static pixel steps."
    bad_pattern: "font-size: 48px; @media (max-width: 768px) { font-size: 28px; }"
    good_pattern: "font-size: clamp(2rem, 1.5rem + 2.5vw, 3.75rem);"

  - id: "TYPE-002"
    name: "readable_line_measure"
    category: "typography"
    source: "webtypography"
    severity: "CRITICAL"
    condition: "body_text_container"
    requirement: "Body copy and long-form prose must constrain line length between 45ch and 75ch (optimal: 65ch) to maintain natural eye sweep."
    bad_pattern: "width: 100%; max-width: 1200px; /* text spans entire monitor */"
    good_pattern: "max-inline-size: 65ch; margin-inline: auto;"

  - id: "TYPE-003"
    name: "proportional_line_height"
    category: "typography"
    source: "webtypography"
    severity: "HIGH"
    condition: "heading_vs_body"
    requirement: "Line-height must be inversely proportional to font size: large display headings require tight leading (1.05 - 1.15), subheadings (1.2 - 1.3), body text (1.5 - 1.65)."
    bad_pattern: "h1 { font-size: 4rem; line-height: 1.5; /* excessive leading */ }"
    good_pattern: "h1 { font-size: clamp(2.5rem, 5vw, 4.5rem); line-height: 1.1; letter-spacing: -0.02em; }"

  - id: "TYPE-004"
    name: "font_pairing_contrast"
    category: "typography"
    source: "fontsource"
    severity: "HIGH"
    condition: "multi_font_usage"
    requirement: "When using secondary font, there must be distinct structural contrast (e.g. Editorial Serif Display + Geometric Sans Body, or Sculptural Grotesk + Monospace metadata). Never pair two similar neo-grotesks."
    bad_pattern: "font-family: Arial (heading) paired with Helvetica (body)"
    good_pattern: "font-family: 'Fraunces', serif (heading) paired with 'Plus Jakarta Sans', sans-serif (body)"

  - id: "TYPE-005"
    name: "uppercase_tracking_compensation"
    category: "typography"
    source: "webtypography"
    severity: "MEDIUM"
    condition: "all_caps_text"
    requirement: "Any text styled with uppercase must expand letter-spacing (+0.05em to +0.15em) and reduce font-size to prevent optical crowding."
    bad_pattern: "text-transform: uppercase; letter-spacing: normal;"
    good_pattern: "text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.75rem;"

  # ----------------------------------------------------------------------------
  # NHÓM 2: LAYOUT PRIMITIVES & COMPOSITION (EVERY LAYOUT + OPEN PROPS)
  # ----------------------------------------------------------------------------
  - id: "LAYOUT-001"
    name: "layout_primitives_over_arbitrary_wrappers"
    category: "layout"
    source: "every-layout"
    severity: "HIGH"
    condition: "structural_composition"
    requirement: "Containers must conform to recognized layout primitives: Stack (vertical flow), Cluster (horizontal wrap), Sidebar (asymmetric flex), Switcher (container threshold toggle), or Grid (auto-fit minmax)."
    bad_pattern: "<div className='box-1'><div className='box-2'><div className='box-3'>"
    good_pattern: "<Stack gap='var(--space-l)'><Cluster gap='var(--space-s)'>...</Cluster></Stack>"

  - id: "LAYOUT-002"
    name: "fluid_auto_grid"
    category: "layout"
    source: "every-layout"
    severity: "HIGH"
    condition: "card_or_item_grid"
    requirement: "Repetitive card grids must use CSS Grid auto-fit/auto-fill with minmax and min(100%, ...) to naturally reflow across all viewports without manual media queries."
    bad_pattern: "@media(min-width: 600px){.col-2} @media(min-width: 900px){.col-3} @media(min-width: 1200px){.col-4}"
    good_pattern: "grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));"

  - id: "LAYOUT-003"
    name: "intentional_asymmetry"
    category: "composition"
    source: "remarque"
    severity: "MEDIUM"
    condition: "page_hero_and_features"
    requirement: "Avoid uniform 50/50 splits or 3 identical equal cards across all sections. Introduce dynamic ratio tension (e.g. 62/38 split, offset editorial text, or staggered vertical rhythm)."
    bad_pattern: "Section 1: 3 cards. Section 2: 3 cards. Section 3: 3 cards. All centered."
    good_pattern: "Hero: Bold asymmetric text with bleed visual anchor. Features: Staggered horizontal flow."

  # ----------------------------------------------------------------------------
  # NHÓM 3: SPACING, TOKENS & RHYTHM (UTOPIA + OPEN PROPS + POLLEN)
  # ----------------------------------------------------------------------------
  - id: "SPACE-001"
    name: "mathematical_spacing_scale"
    category: "spacing"
    source: "open-props"
    severity: "CRITICAL"
    condition: "margin_padding_gap"
    requirement: "All padding, margin, and gap values must resolve to named tokens in the spacing scale (e.g. space-3xs, 2xs, xs, s, m, l, xl, 2xl, 3xl). Arbitrary magic numbers (e.g. 19px, 37px, 53px) are strictly forbidden."
    bad_pattern: "padding: 19px 37px; margin-top: 53px;"
    good_pattern: "padding: var(--space-m) var(--space-l); margin-block-start: var(--space-xl);"

  - id: "SPACE-002"
    name: "law_of_proximity_vertical_rhythm"
    category: "spacing"
    source: "carbon"
    severity: "HIGH"
    condition: "heading_preceding_following_space"
    requirement: "The space preceding a section heading (space-above) must be at least 1.5x to 2.5x larger than the space between the heading and its associated body copy (space-below)."
    bad_pattern: "h2 { margin-top: 24px; margin-bottom: 24px; /* unanchored heading */ }"
    good_pattern: "h2 { margin-block-start: var(--space-2xl); margin-block-end: var(--space-xs); }"

  # ----------------------------------------------------------------------------
  # NHÓM 4: ANTI-AI-TEMPLATE DEFENSE & LIGHT THEME DEFAULT
  # ----------------------------------------------------------------------------
  - id: "ANTI-AI-001"
    name: "mandatory_light_theme_default"
    category: "color"
    source: "antigravity-operating-anchor"
    severity: "CRITICAL"
    condition: "all_themes_and_templates"
    requirement: "Default 100% to light theme aesthetics (pure white, cream, ivory, beige, light pastel, warm stone). Black / dark theme is strictly prohibited unless explicitly requested by Anh."
    bad_pattern: "background-color: #0d0d0d; color: #f3f3f3; /* unrequested dark mode */"
    good_pattern: "background-color: #faf9f6; color: #1a1a1a; /* warm paper light theme */"

  - id: "ANTI-AI-002"
    name: "prohibit_generic_ai_purple_gradients"
    category: "color"
    source: "antigravity-visual-critic"
    severity: "CRITICAL"
    condition: "background_and_accents"
    requirement: "Never use generic AI purple/magenta/cyan neon gradients (#8b5cf6 -> #ec4899) as a default aesthetic. Choose bespoke, sophisticated palettes anchored in the project brand thesis."
    bad_pattern: "background: linear-gradient(135deg, #6366f1, #ec4899);"
    good_pattern: "background: #f8fafc; border: 1px solid #e2e8f0; accent: #0f766e (Deep Teal);"

  - id: "ANTI-AI-003"
    name: "no_meaningless_bento_box"
    category: "composition"
    source: "antigravity-visual-critic"
    severity: "HIGH"
    condition: "feature_sections"
    requirement: "Do not default to a bento grid unless information density and hierarchy strictly demand differing container weights. Prefer clean typographic lists, editorial splits, or functional interfaces."
    bad_pattern: "Randomly dividing 5 uniform bullet points into a 4-box bento grid with random aspect ratios."
    good_pattern: "Editorial layout where primary value prop receives 65% width and secondary points follow hierarchical flow."

  - id: "ANTI-AI-004"
    name: "no_gratuitous_3d_or_motion"
    category: "visual_execution"
    source: "design-director-charter"
    severity: "CRITICAL"
    condition: "before_composition_approval"
    requirement: "3D canvases and complex GSAP animations must never be applied to mask a weak, unanchored layout. The page must be visually compelling, legible, and balanced with JavaScript and 3D completely disabled."
    bad_pattern: "Embedding a spinning 3D torus in the hero to distract from poor typography and broken spacing."
    good_pattern: "Flawless typography and composition pass 100% first; 3D model added solely as an interactive product proof."
