<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanical Odometer Counter — Signature Wow Block</title>
  <style>
    /* ==========================================================================
       LUMINOUS LIGHT THEME TOKENS
       ========================================================================== */
    :root {
      --bg-canvas: #F8FAFC;
      --bg-surface: #FFFFFF;
      --border-luminous: rgba(15, 23, 42, 0.08);
      --border-highlight: rgba(255, 255, 255, 0.95);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --accent-blue: #0284C7;
      --accent-blue-hover: #0369A1;
      --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.03);
      --shadow-surface: 0 1px 3px rgba(15, 23, 42, 0.04), 0 6px 16px -2px rgba(15, 23, 42, 0.05);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-spring: cubic-bezier(0.22, 1.61, 0.36, 1.0);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      background-image: 
        radial-gradient(at 10% 10%, rgba(2, 132, 199, 0.04) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(245, 158, 11, 0.03) 0px, transparent 50%),
        linear-gradient(to right, rgba(15, 23, 42, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      width: 100%;
      text-align: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.2);
      border-radius: 9999px;
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    p.subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 580px;
      margin: 0 auto 40px;
      line-height: 1.5;
    }

    /* ==========================================================================
       MECHANICAL ODOMETER HOUSING & TUMBLER REELS
       ========================================================================== */
    .odometer-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-luminous);
      border-radius: 24px;
      padding: 48px 36px;
      box-shadow: var(--shadow-card), inset 0 1px 0 var(--border-highlight);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .odometer-housing {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: #F1F5F9;
      border: 1.5px solid rgba(15, 23, 42, 0.12);
      border-radius: 16px;
      padding: 10px 16px;
      box-shadow: 
        inset 0 4px 8px rgba(15, 23, 42, 0.08),
        inset 0 -4px 8px rgba(15, 23, 42, 0.08),
        0 4px 12px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }

    /* Top & Bottom Cylinder Reflection Shadows */
    .odometer-housing::before,
    .odometer-housing::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 18px;
      pointer-events: none;
      z-index: 10;
    }

    .odometer-housing::before {
      top: 0;
      background: linear-gradient(180deg, rgba(203, 213, 225, 0.85) 0%, transparent 100%);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    }

    .odometer-housing::after {
      bottom: 0;
      background: linear-gradient(0deg, rgba(203, 213, 225, 0.85) 0%, transparent 100%);
      border-top: 1px solid rgba(15, 23, 42, 0.06);
    }

    /* Currency / Symbol Prefix */
    .odometer-symbol {
      font-size: 42px;
      font-weight: 800;
      color: var(--accent-blue);
      margin-right: 6px;
      user-select: none;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    /* Individual Digit Reels */
    .odometer-column {
      position: relative;
      width: 44px;
      height: 64px;
      overflow: hidden;
      margin: 0 2px;
      background: #FFFFFF;
      border-radius: 8px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .odometer-reel {
      display: flex;
      flex-direction: column;
      transform: translateY(0);
      transition: transform 600ms cubic-bezier(0.23, 1, 0.32, 1);
      will-change: transform;
    }

    .odometer-digit {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      font-weight: 800;
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-feature-settings: "tnum";
      user-select: none;
    }

    /* Comma Separator */
    .odometer-comma {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 14px;
      height: 64px;
      font-size: 38px;
      font-weight: 800;
      color: var(--text-secondary);
      padding-bottom: 8px;
      user-select: none;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }

    /* ==========================================================================
       CONTROLS & STEPPERS
       ========================================================================== */
    .controls-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-luminous);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), inset 0 1px 0 var(--border-highlight);
      transition: transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
      outline: none;
      user-select: none;
    }

    .ctrl-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08), inset 0 1px 0 var(--border-highlight);
    }

    .ctrl-btn:active {
      transform: scale(0.965);
    }

    .ctrl-btn.primary {
      background: linear-gradient(180deg, #0284C7 0%, #0369A1 100%);
      color: #FFFFFF;
      border-color: rgba(2, 132, 199, 0.85);
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .ctrl-btn.primary:hover {
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    /* Sound Status */
    .sound-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .sound-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="tag">Signature Wow Block 04</div>
    <h1>Mechanical Odometer Counter</h1>
    <p class="subtitle">Vertical mechanical tumbler reels with cylindrical detent shading and real-time synthesized acoustic tick sound.</p>

    <!-- Odometer Display Card -->
    <div class="odometer-card">
      <div class="odometer-housing" id="odometerHousing" aria-live="polite">
        <span class="odometer-symbol">$</span>
        <!-- Digit columns rendered dynamically -->
      </div>

      <div class="sound-badge">
        <span class="dot"></span>
        <span>Acoustic Detent Sound: Synthesized Mechanical Tick</span>
      </div>
    </div>

    <!-- Stepper Controls -->
    <div class="controls-grid">
      <button class="ctrl-btn" id="btnPlus1">+ 1</button>
      <button class="ctrl-btn" id="btnPlus10">+ 10</button>
      <button class="ctrl-btn" id="btnPlus250">+ 250</button>
      <button class="ctrl-btn" id="btnPlus1k">+ 1,000</button>
      <button class="ctrl-btn" id="btnRandom">Randomize</button>
      <button class="ctrl-btn primary" id="btnAutoSim">Simulate Live Ticker</button>
    </div>
  </div>

  <script>
    // 1. MECHANICAL DETENT SOUND SYNTHESIZER
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playDetentTick(frequencyOffset = 0) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // Realistic mechanical click: fast sine burst with quick decay
        osc.type = 'triangle';
        const baseFreq = 1200 + frequencyOffset;
        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.015);

        gain.gain.setValueAtTime(0.09, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.015);
      } catch {}
    }

    // 2. MECHANICAL ODOMETER ENGINE
    class MechanicalOdometer {
      constructor(containerEl, initialValue = 184920) {
        this.container = containerEl;
        this.currentValue = initialValue;
        this.digitHeight = 64;
        this.columns = [];
        this.render(this.currentValue);
      }

      formatNumber(num) {
        return num.toLocaleString();
      }

      render(targetNum) {
        const formattedStr = this.formatNumber(targetNum);
        this.container.innerHTML = `<span class="odometer-symbol">$</span>`;
        this.columns = [];

        for (let i = 0; i < formattedStr.length; i++) {
          const char = formattedStr[i];
          if (char === ',') {
            const commaEl = document.createElement('div');
            commaEl.className = 'odometer-comma';
            commaEl.textContent = ',';
            this.container.appendChild(commaEl);
          } else {
            const digit = parseInt(char, 10);
            const col = document.createElement('div');
            col.className = 'odometer-column';

            const reel = document.createElement('div');
            reel.className = 'odometer-reel';

            // Stack 0 through 9
            for (let d = 0; d <= 9; d++) {
              const digitEl = document.createElement('div');
              digitEl.className = 'odometer-digit';
              digitEl.textContent = d;
              reel.appendChild(digitEl);
            }
            // Wrapped 0 at index 10 for continuous forward tumbling
            const wrapEl = document.createElement('div');
            wrapEl.className = 'odometer-digit';
            wrapEl.textContent = '0';
            reel.appendChild(wrapEl);

            col.appendChild(reel);
            this.container.appendChild(col);

            this.columns.push({
              reel,
              currentDigit: digit
            });

            // Set initial position
            reel.style.transform = `translateY(-${digit * this.digitHeight}px)`;
          }
        }
      }

      setValue(newNum) {
        const oldStr = this.formatNumber(this.currentValue);
        const newStr = this.formatNumber(newNum);

        // If string length or comma structure changes, re-render
        if (oldStr.length !== newStr.length) {
          this.currentValue = newNum;
          this.render(newNum);
          playDetentTick(100);
          return;
        }

        let tickDelay = 0;
        let colIndex = 0;

        for (let i = 0; i < newStr.length; i++) {
          if (newStr[i] === ',') continue;

          const newDigit = parseInt(newStr[i], 10);
          const col = this.columns[colIndex];

          if (col && col.currentDigit !== newDigit) {
            const oldDigit = col.currentDigit;
            col.currentDigit = newDigit;

            // Forward roll for 9 -> 0 transition (tumbler never spins backwards on increment)
            if (oldDigit === 9 && newDigit === 0) {
              col.reel.style.transition = 'transform 550ms cubic-bezier(0.23, 1, 0.32, 1)';
              col.reel.style.transform = `translateY(-${10 * this.digitHeight}px)`;
              setTimeout(() => {
                col.reel.style.transition = 'none';
                col.reel.style.transform = 'translateY(0px)';
                void col.reel.offsetHeight; // trigger reflow
                col.reel.style.transition = 'transform 550ms cubic-bezier(0.23, 1, 0.32, 1)';
              }, 560);
            } else {
              col.reel.style.transition = 'transform 550ms cubic-bezier(0.23, 1, 0.32, 1)';
              col.reel.style.transform = `translateY(-${newDigit * this.digitHeight}px)`;
            }
            
            // Audio tick for each moving reel
            setTimeout(() => {
              playDetentTick((9 - newDigit) * 30);
            }, tickDelay);
            tickDelay += 35;
          }
          colIndex++;
        }

        this.currentValue = newNum;
      }

      add(delta) {
        this.setValue(this.currentValue + delta);
      }
    }

    const housing = document.getElementById('odometerHousing');
    const odometer = new MechanicalOdometer(housing, 184920);

    // 3. BUTTON EVENT LISTENERS
    document.getElementById('btnPlus1').addEventListener('click', () => odometer.add(1));
    document.getElementById('btnPlus10').addEventListener('click', () => odometer.add(10));
    document.getElementById('btnPlus250').addEventListener('click', () => odometer.add(250));
    document.getElementById('btnPlus1k').addEventListener('click', () => odometer.add(1000));
    document.getElementById('btnRandom').addEventListener('click', () => {
      const randVal = Math.floor(100000 + Math.random() * 899999);
      odometer.setValue(randVal);
    });

    // Live Ticker Simulator
    let simInterval = null;
    const simBtn = document.getElementById('btnAutoSim');

    simBtn.addEventListener('click', () => {
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
        simBtn.textContent = 'Simulate Live Ticker';
        simBtn.classList.remove('active');
      } else {
        simBtn.textContent = 'Pause Ticker';
        simInterval = setInterval(() => {
          odometer.add(Math.floor(1 + Math.random() * 15));
        }, 320);
      }
    });
  </script>
</body>
</html>
