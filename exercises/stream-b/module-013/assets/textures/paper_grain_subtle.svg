<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <!-- Subtle organic paper fibers / Sợi giấy và hạt xúc giác hữu cơ -->
    <filter id="paper-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.11   0 0 0 0 0.10   0 0 0 0 0.09  0 0 0 0.035 0" />
    </filter>
  </defs>
  <!-- Background warm paper canvas / Nền giấy ấm -->
  <rect width="120" height="120" fill="#FAF8F5" />
  <!-- Micro-fiber specs / Các chấm sợi giấy ngẫu nhiên vi mô -->
  <rect width="120" height="120" filter="url(#paper-noise)" />
  <!-- Fine scattered organic tactile fiber marks -->
  <circle cx="18" cy="24" r="0.6" fill="#A8A29E" opacity="0.3" />
  <circle cx="74" cy="12" r="0.5" fill="#78716C" opacity="0.25" />
  <circle cx="95" cy="68" r="0.7" fill="#A8A29E" opacity="0.2" />
  <circle cx="36" cy="85" r="0.6" fill="#78716C" opacity="0.3" />
  <circle cx="58" cy="48" r="0.4" fill="#A8A29E" opacity="0.35" />
  <circle cx="110" cy="105" r="0.5" fill="#78716C" opacity="0.2" />
  <!-- Subtle fiber thread / Vết sợi tự nhiên -->
  <path d="M 45 30 Q 47 34 49 33" stroke="#D6D3D1" stroke-width="0.5" fill="none" opacity="0.4" />
  <path d="M 82 92 Q 85 95 89 94" stroke="#D6D3D1" stroke-width="0.5" fill="none" opacity="0.4" />
</svg>
