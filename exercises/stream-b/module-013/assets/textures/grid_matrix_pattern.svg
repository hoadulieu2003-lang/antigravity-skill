<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- Sub-millimeter 4px grid / Vạch chia 4px vi mô -->
    <pattern id="sub-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="20" y2="4" stroke="#F1F5F9" stroke-width="0.5" />
      <line x1="0" y1="8" x2="20" y2="8" stroke="#F1F5F9" stroke-width="0.5" />
      <line x1="0" y1="12" x2="20" y2="12" stroke="#F1F5F9" stroke-width="0.5" />
      <line x1="0" y1="16" x2="20" y2="16" stroke="#F1F5F9" stroke-width="0.5" />
      <line x1="4" y1="0" x2="4" y2="20" stroke="#F1F5F9" stroke-width="0.5" />
      <line x1="8" y1="0" x2="8" y2="20" stroke="#F1F5F9" stroke-width="0.5" />
      <line x1="12" y1="0" x2="12" y2="20" stroke="#F1F5F9" stroke-width="0.5" />
      <line x1="16" y1="0" x2="16" y2="20" stroke="#F1F5F9" stroke-width="0.5" />
      <!-- 20px cell border -->
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.75" />
      <!-- Micro cross intersection point / Dấu điểm giao tọa độ -->
      <circle cx="20" cy="20" r="0.75" fill="#CBD5E1" />
    </pattern>
  </defs>
  <!-- Background slate / Nền xám kỹ thuật -->
  <rect width="100" height="100" fill="#F8FAFC" />
  <!-- Pattern fill / Phủ lưới -->
  <rect width="100" height="100" fill="url(#sub-grid)" />
  <!-- 100px major axis line / Vạch phân cách tọa độ chính 100px -->
  <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#CBD5E1" stroke-width="1.25" />
</svg>
