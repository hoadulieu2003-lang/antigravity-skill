<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="op-scene-title op-scene-desc">
  <title id="op-scene-title">Hiện trường Điều phối: Rà soát Danh sách Phòng và Liên hệ Đối tác</title>
  <desc id="op-scene-desc">Góc làm việc thực tế của người điều phối: Bìa kẹp hồ sơ điều hành tour T01, bảng danh sách khách sạn với 4 phòng chờ xác nhận được đánh dấu màu hổ phách, máy điện thoại bàn và sổ tay ghi chép hiện trường.</desc>

  <defs>
    <!-- Desk surface gradient / Bề mặt bàn làm việc gỗ sồi trầm -->
    <linearGradient id="desk-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7E0D3" />
      <stop offset="100%" stop-color="#D8CFBE" />
    </linearGradient>

    <!-- Card drop shadow / Đổ bóng hồ sơ -->
    <filter id="clipboard-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1C1917" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Desk Surface / Bề mặt bàn làm việc -->
  <rect x="0" y="0" width="400" height="300" fill="url(#desk-wood)" />

  <!-- Clipboard (Bìa kẹp hồ sơ điều hành T01) -->
  <g transform="translate(60, 30)" filter="url(#clipboard-shadow)">
    <!-- Wooden board / Bìa gỗ cứng -->
    <rect x="0" y="0" width="210" height="245" rx="8" fill="#854D0E" stroke="#713F12" stroke-width="1.5" />
    <rect x="5" y="5" width="200" height="235" rx="6" fill="#A16207" opacity="0.15" />

    <!-- Paper Sheet / Tờ phiếu điều hành tour Daily Brief -->
    <rect x="12" y="18" width="186" height="215" rx="2" fill="#FAF8F5" stroke="#E7E2DA" stroke-width="1" />

    <!-- Top Metal Clip / Kẹp kim loại đỉnh bìa -->
    <rect x="75" y="-6" width="60" height="24" rx="4" fill="#94A3B8" stroke="#475569" stroke-width="1.5" />
    <circle cx="105" cy="4" r="4" fill="#E2E8F0" />

    <!-- Document Header / Tiêu đề văn bản -->
    <text x="24" y="42" font-family="'Times New Roman', Georgia, serif" font-size="11" font-weight="bold" fill="#1C1917">LỆNH ĐIỀU PHỐI T01</text>
    <text x="24" y="54" font-family="system-ui, sans-serif" font-size="8" fill="#57534E">Hạ Long 2N1Đ · Khởi hành: 14/09 07:30</text>
    <line x1="24" y1="59" x2="186" y2="59" stroke="#E7E2DA" stroke-width="1" />

    <!-- Checklist rows / Các mục kiểm tra -->
    <!-- Item 1: Xe -->
    <text x="24" y="74" font-family="system-ui, sans-serif" font-size="8.5" fill="#065F46" font-weight="bold">✓ 01. Mã tour: T01 · Hạ Long 2N1Đ</text>
    <!-- Item 2: Hướng dẫn viên -->
    <text x="24" y="89" font-family="system-ui, sans-serif" font-size="8.5" fill="#065F46" font-weight="bold">✓ 02. Điều phối viên phụ trách: Lan</text>
    <!-- Item 3: Tàu Tuần Châu -->
    <text x="24" y="104" font-family="system-ui, sans-serif" font-size="8.5" fill="#065F46" font-weight="bold">✓ 03. Khởi hành: 14/09/2026 07:30</text>
    
    <!-- Item 4: Khách sạn Hạ Long (CRITICAL UNCONFIRMED AMBER HIGHLIGHT) -->
    <rect x="20" y="112" width="170" height="42" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.25" />
    <text x="26" y="125" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#92400E">⚠ 04. ĐIỂM NGHẼN TOUR T01</text>
    <text x="26" y="138" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#B45309">Khách sạn chưa xác nhận 4 phòng!</text>
    <text x="26" y="149" font-family="system-ui, sans-serif" font-size="7.5" fill="#78350F">Đang theo dõi xác nhận trước giờ khởi hành</text>

    <!-- Item 5: Bảo hiểm -->
    <text x="24" y="170" font-family="system-ui, sans-serif" font-size="8" fill="#57534E">05. Trạng thái vận hành: Chờ đối tác</text>
    <!-- Item 6: Thu tiền tour -->
    <text x="24" y="184" font-family="system-ui, sans-serif" font-size="8" fill="#57534E">06. Mốc thời gian đối soát: 13/09/2026 18:00 ICT</text>

    <!-- Coordinator Signature Box / Khung ký duyệt điều phối viên -->
    <rect x="110" y="196" width="76" height="28" rx="2" fill="#F5F0E8" stroke="#D6CEC2" stroke-width="1" />
    <text x="148" y="208" font-family="system-ui, sans-serif" font-size="7.5" fill="#78716C" text-anchor="middle">Điều phối viên</text>
    <text x="148" y="220" font-family="'Times New Roman', Georgia, serif" font-size="10" font-style="italic" fill="#1C1917" text-anchor="middle">Lan</text>
  </g>

  <!-- Desk Telephone Handset (Right Side) / Ống nghe điện thoại bàn liên lạc đối tác -->
  <g transform="translate(290, 50)" filter="url(#clipboard-shadow)">
    <!-- Telephone base station / Thân máy điện thoại điều hành -->
    <rect x="0" y="0" width="85" height="120" rx="6" fill="#334155" stroke="#1E293B" stroke-width="1.5" />
    <!-- Number pad / Bàn phím số -->
    <rect x="12" y="45" width="60" height="60" rx="3" fill="#1E293B" />
    <circle cx="24" cy="58" r="4" fill="#64748B" />
    <circle cx="42" cy="58" r="4" fill="#64748B" />
    <circle cx="60" cy="58" r="4" fill="#64748B" />
    <circle cx="24" cy="74" r="4" fill="#64748B" />
    <circle cx="42" cy="74" r="4" fill="#64748B" />
    <circle cx="60" cy="74" r="4" fill="#64748B" />
    <circle cx="24" cy="90" r="4" fill="#64748B" />
    <circle cx="42" cy="90" r="4" fill="#64748B" />
    <circle cx="60" cy="90" r="4" fill="#64748B" />
    <!-- LCD display screen / Màn hình hiển thị số gọi đi -->
    <rect x="12" y="12" width="60" height="22" rx="2" fill="#0F172A" />
    <text x="16" y="27" font-family="'Consolas', monospace" font-size="8" fill="#38BDF8">XAC NHAN PHONG</text>
  </g>

  <!-- Field Notebook & Ballpoint Pen (Bottom Left) / Sổ tay bỏ túi và bút bi -->
  <g transform="translate(15, 175)" filter="url(#clipboard-shadow)">
    <rect x="0" y="0" width="55" height="95" rx="4" fill="#44403C" stroke="#292524" stroke-width="1" />
    <!-- Elastic strap / Dây thun gài sổ -->
    <line x1="0" y1="20" x2="55" y2="20" stroke="#78716C" stroke-width="2" />
    <!-- Pen / Cây bút bi điều phối viên -->
    <rect x="42" y="-10" width="6" height="105" rx="3" fill="#C2410C" stroke="#9A3412" stroke-width="0.75" />
    <polygon points="42,95 48,95 45,102" fill="#1C1917" />
  </g>

  <!-- Cup of Tea / Tách trà làm dịu áp lực trên bàn -->
  <g transform="translate(325, 215)">
    <circle cx="25" cy="25" r="24" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="25" cy="25" r="18" fill="#FAF8F5" stroke="#D6CEC2" stroke-width="1" />
    <circle cx="25" cy="25" r="14" fill="#B45309" opacity="0.6" />
    <!-- Tea handle / Quai chén -->
    <path d="M 45 18 C 54 20, 54 30, 45 32" fill="none" stroke="#CBD5E1" stroke-width="2.5" />
  </g>
</svg>
