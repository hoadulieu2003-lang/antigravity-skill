<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="840" height="180" role="img" aria-labelledby="t01-schematic-title t01-schematic-desc">
  <title id="t01-schematic-title">Sơ đồ Mốc Lộ trình Tuyến T01 Hạ Long — Route Sequence Schematic</title>
  <desc id="t01-schematic-desc">Sơ đồ chuỗi 4 mốc lộ trình đoàn T01: (1) Hà Nội lúc 07:30 [Chuẩn bị hồ sơ - Sẵn sàng]; (2) Hải Dương lúc 09:00 [Nghỉ chân hậu cần]; (3) Bãi Cháy lúc 11:45 [Chờ đối tác xác nhận 4 phòng - Điểm nghẽn]; (4) Cảng Tuần Châu lúc 13:30 [Sẵn sàng đón đoàn].</desc>

  <defs>
    <!-- Hatching pattern for pending segment -->
    <pattern id="warning-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#F59E0B" stroke-width="2.5" />
      <line x1="4" y1="0" x2="4" y2="8" stroke="#FEF3C7" stroke-width="4" />
    </pattern>
  </defs>

  <!-- Instrument panel background -->
  <rect x="0" y="0" width="840" height="180" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" rx="6" />

  <!-- Sub-grid guide lines -->
  <line x1="30" y1="30" x2="810" y2="30" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="30" y1="150" x2="810" y2="150" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2 4" />

  <!-- MAIN TRANSIT TRACK — Section 1: Hanoi to Hai Duong -->
  <line x1="110" y1="90" x2="330" y2="90" stroke="#16A34A" stroke-width="5" stroke-linecap="round" />
  <line x1="110" y1="90" x2="330" y2="90" stroke="#DCFCE7" stroke-width="2" stroke-linecap="round" />

  <!-- MAIN TRANSIT TRACK — Section 2: Hai Duong to Bai Chay -->
  <line x1="330" y1="90" x2="520" y2="90" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round" />

  <!-- PENDING TRACK SEGMENT: Bai Chay Approach -->
  <rect x="520" y="83" width="60" height="14" fill="url(#warning-hatch)" stroke="#D97706" stroke-width="1" rx="2" />

  <!-- MAIN TRANSIT TRACK — Section 3: Bai Chay to Tuan Chau -->
  <line x1="580" y1="90" x2="750" y2="90" stroke="#94A3B8" stroke-width="3" stroke-dasharray="4 4" />

  <!-- MỐC 1: HÀ NỘI (07:30) -->
  <g transform="translate(110, 90)">
    <rect x="-14" y="-14" width="28" height="28" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5" rx="4" />
    <rect x="-5" y="-5" width="10" height="10" fill="#16A34A" rx="2" />
    <text x="0" y="-28" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#16A34A" text-anchor="middle">07:30 ICT</text>
    <text x="0" y="-42" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">HÀ NỘI (XUẤT PHÁT)</text>
    <text x="0" y="30" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Chuẩn bị hồ sơ</text>
    <rect x="-36" y="36" width="72" height="18" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" rx="2" />
    <text x="0" y="49" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">SẴN SÀNG</text>
  </g>

  <!-- MỐC 2: HẢI DƯƠNG (09:00) -->
  <g transform="translate(330, 90)">
    <rect x="-12" y="-12" width="24" height="24" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" rx="3" />
    <circle cx="0" cy="0" r="4" fill="#0F172A" />
    <text x="0" y="-26" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">09:00 ICT</text>
    <text x="0" y="-40" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">HẢI DƯƠNG</text>
    <text x="0" y="28" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Nghỉ chân hậu cần</text>
    <rect x="-42" y="34" width="84" height="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="2" />
    <text x="0" y="47" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">THEO KẾ HOẠCH</text>
  </g>

  <!-- MỐC 3: BÃI CHÁY (11:45) — ĐIỂM CHỜ XÁC NHẬN -->
  <g transform="translate(550, 90)">
    <!-- Warning diamond -->
    <polygon points="0,-20 20,0 0,20 -20,0" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" />
    <rect x="-5" y="-5" width="10" height="10" fill="#DC2626" rx="1" />
    <text x="0" y="-42" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#991B1B" text-anchor="middle">BÃI CHÁY (KHÁCH SẠN)</text>
    <text x="0" y="-26" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#DC2626" text-anchor="middle">11:45 ICT</text>
    <!-- Schematic alert readout card -->
    <rect x="-95" y="28" width="190" height="38" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" rx="4" />
    <text x="0" y="43" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#991B1B" text-anchor="middle">CHỜ XÁC NHẬN 4 PHÒNG</text>
    <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">ĐIỂM NGHẼN CẦN XỬ LÝ</text>
  </g>

  <!-- MỐC 4: TUẦN CHÂU (13:30) -->
  <g transform="translate(750, 90)">
    <rect x="-12" y="-12" width="24" height="24" fill="#FFFFFF" stroke="#64748B" stroke-width="2" rx="3" />
    <circle cx="0" cy="0" r="4" fill="#64748B" />
    <text x="0" y="-26" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">13:30 ICT</text>
    <text x="0" y="-40" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">CẢNG TUẦN CHÂU</text>
    <text x="0" y="28" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#64748B" text-anchor="middle">Sẵn sàng đón đoàn</text>
    <rect x="-42" y="34" width="84" height="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="2" />
    <text x="0" y="47" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">CHỜ THÔNG TUYẾN</text>
  </g>
</svg>
