<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="840" height="180" role="img" aria-labelledby="t01-narrative-title t01-narrative-desc">
  <title id="t01-narrative-title">Sơ đồ Chuỗi Lộ trình T01 Hạ Long 2N1Đ — Góc nhìn Nhân văn Thực địa</title>
  <desc id="t01-narrative-desc">Sơ đồ dòng thời gian 4 mốc lộ trình của đoàn T01: Hà Nội đón khách lúc 07:30, trạm nghỉ Hải Dương 09:00, khách sạn Bãi Cháy có điểm nghẽn chưa xác nhận 4 phòng lúc 11:45, và cảng tàu Tuần Châu lúc 13:30.</desc>

  <defs>
    <!-- Filter for soft warm shadow / Đổ bóng mềm ấm áp -->
    <filter id="soft-card-shadow" x="-8%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1C1917" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background container / Nền sơ đồ giấy ấm -->
  <rect x="0" y="0" width="840" height="180" rx="12" fill="#FAF8F5" stroke="#E7E2DA" stroke-width="1.5" />

  <!-- Narrative organic connecting trail / Đường lộ trình hữu cơ mềm mại -->
  <path d="M 110 90 C 200 90, 240 75, 330 75 C 420 75, 460 105, 550 105 C 640 105, 680 90, 750 90" 
        fill="none" stroke="#D6D0C7" stroke-width="4" stroke-linecap="round" />

  <!-- Trail progress lines / Đoạn lộ trình đã sẵn sàng -->
  <path d="M 110 90 C 200 90, 240 75, 330 75" 
        fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" />

  <!-- Bottleneck warning trail / Đoạn cảnh báo điểm nghẽn Bãi Cháy -->
  <path d="M 330 75 C 420 75, 460 105, 550 105" 
        fill="none" stroke="#D97706" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" />

  <!-- MILESTONE 1: Hà Nội (07:30 14/09) -->
  <g transform="translate(110, 90)">
    <circle cx="0" cy="0" r="18" fill="#ECFDF5" stroke="#059669" stroke-width="2.5" />
    <circle cx="0" cy="0" r="7" fill="#059669" />
    <!-- Milestone label / Nhãn mốc -->
    <text x="0" y="-30" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="bold" fill="#1C1917" text-anchor="middle">1. Hà Nội</text>
    <text x="0" y="-14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">07:30 · 14/09</text>
    <text x="0" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#57534E" text-anchor="middle">Đón khách Nhà hát Lớn</text>
    <rect x="-38" y="42" width="76" height="18" rx="9" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">✓ Sẵn sàng xe</text>
  </g>

  <!-- MILESTONE 2: Trạm nghỉ Hải Dương (09:00) -->
  <g transform="translate(330, 75)">
    <circle cx="0" cy="0" r="15" fill="#ECFDF5" stroke="#059669" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#059669" />
    <!-- Milestone label / Nhãn mốc -->
    <text x="0" y="-28" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="bold" fill="#1C1917" text-anchor="middle">2. Hải Dương</text>
    <text x="0" y="-13" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">09:00</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#57534E" text-anchor="middle">Nghỉ chân 20 phút</text>
    <rect x="-34" y="38" width="68" height="18" rx="9" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
    <text x="0" y="51" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">✓ Hậu cần ổn</text>
  </g>

  <!-- MILESTONE 3: Khách sạn Bãi Cháy (11:45) — BOTTLENECK FOCAL POINT -->
  <g transform="translate(550, 105)" filter="url(#soft-card-shadow)">
    <!-- Elevated pulse ring / Vòng cảnh báo điểm nghẽn -->
    <circle cx="0" cy="0" r="24" fill="#FEF3C7" stroke="#D97706" stroke-width="2" stroke-dasharray="4 2" />
    <circle cx="0" cy="0" r="16" fill="#FFFBEB" stroke="#B45309" stroke-width="2.5" />
    <!-- Exclamation mark / Dấu chấm than cảnh báo -->
    <line x1="0" y1="-7" x2="0" y2="1" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="6" r="1.5" fill="#92400E" />
    <!-- Milestone label / Nhãn mốc -->
    <text x="0" y="-36" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="bold" fill="#9A3412" text-anchor="middle">3. Khách sạn Bãi Cháy</text>
    <text x="0" y="-20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">11:45 (Check-in)</text>
    <!-- Bottleneck callout box / Khung cảnh báo nổi bật -->
    <rect x="-78" y="28" width="156" height="34" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
    <text x="0" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle">⚠ CHỜ ĐỐI TÁC XÁC NHẬN</text>
    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#78350F" text-anchor="middle">Chưa xác nhận 4 phòng</text>
  </g>

  <!-- MILESTONE 4: Cảng tàu Tuần Châu (13:30) -->
  <g transform="translate(750, 90)">
    <circle cx="0" cy="0" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#2563EB" />
    <!-- Milestone label / Nhãn mốc -->
    <text x="0" y="-28" font-family="'Times New Roman', Georgia, serif" font-size="14" font-weight="bold" fill="#1C1917" text-anchor="middle">4. Cảng Tuần Châu</text>
    <text x="0" y="-13" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">13:30 (Xuống tàu)</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#57534E" text-anchor="middle">Tàu Hạ Long VIP 28</text>
    <rect x="-35" y="38" width="70" height="18" rx="9" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="0" y="51" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1E40AF" text-anchor="middle">✓ Giữ chỗ tàu</text>
  </g>
</svg>
