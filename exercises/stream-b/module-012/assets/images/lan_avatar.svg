<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="lan-avatar-title lan-avatar-desc">
  <title id="lan-avatar-title">Chân dung minh họa Lan — Điều phối viên chính (Nhân vật giả lập)</title>
  <desc id="lan-avatar-desc">Minh họa vector cách điệu chân dung bán thân của Lan, điều phối viên tour T01, kèm huy hiệu minh bạch nhân vật giả lập phục vụ đào tạo.</desc>

  <defs>
    <!-- Circular clip path / Khung cắt tròn -->
    <clipPath id="avatar-circle">
      <circle cx="100" cy="92" r="82" />
    </clipPath>
    <!-- Soft warm shadow / Đổ bóng nhẹ -->
    <filter id="avatar-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1C1917" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Outer background circle / Vòng nền bên ngoài -->
  <circle cx="100" cy="92" r="86" fill="#F5F0E8" stroke="#D6CEC2" stroke-width="2" />

  <!-- Clipped character illustration / Hình minh họa nhân vật được cắt tròn -->
  <g clip-path="url(#avatar-circle)">
    <!-- Soft background fill / Nền phía sau chân dung -->
    <rect x="0" y="0" width="200" height="200" fill="#EAE4DA" />
    
    <!-- Desk / Background ambient / Nền phòng điều hành mờ nhẹ -->
    <path d="M 0 140 L 200 135 L 200 200 L 0 200 Z" fill="#DDD5C7" />

    <!-- Shoulders / Torso / Áo sơ mi công sở vải linen tự nhiên -->
    <path d="M 42 195 C 45 155, 65 142, 100 142 C 135 142, 155 155, 158 195 Z" fill="#292524" />
    <!-- Shirt collar / Cổ áo sơ mi màu kem -->
    <polygon points="100,162 82,142 94,142 100,154 106,142 118,142" fill="#FAF8F5" />
    <path d="M 100 154 L 100 195" stroke="#E7E2DA" stroke-width="1.5" />

    <!-- Neck / Cổ -->
    <rect x="88" y="118" width="24" height="28" rx="4" fill="#E8B595" />
    <path d="M 88 132 C 94 138, 106 138, 112 132" fill="#D99B77" opacity="0.4" />

    <!-- Face shape / Khuôn mặt điềm tĩnh nhân văn -->
    <ellipse cx="100" cy="88" rx="34" ry="42" fill="#F3C3A6" />
    <!-- Soft ear lobes / Tai -->
    <circle cx="66" cy="88" r="8" fill="#F3C3A6" />
    <circle cx="134" cy="88" r="8" fill="#F3C3A6" />

    <!-- Hair / Mái tóc màu than đen tự nhiên buộc gọn -->
    <path d="M 64 85 C 62 55, 78 40, 100 40 C 122 40, 138 55, 136 85 C 130 65, 120 54, 100 54 C 80 54, 70 65, 64 85 Z" fill="#1C1917" />
    <!-- Hair bun / Búi tóc phía sau -->
    <circle cx="100" cy="38" r="16" fill="#1C1917" />

    <!-- Eyebrows / Lông mày thanh thoát -->
    <path d="M 76 74 Q 84 72 92 75" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />
    <path d="M 108 75 Q 116 72 124 74" fill="none" stroke="#292524" stroke-width="2" stroke-linecap="round" />

    <!-- Eyes / Mắt ánh nhìn tập trung, ấm áp -->
    <circle cx="84" cy="82" r="3.5" fill="#1C1917" />
    <circle cx="116" cy="82" r="3.5" fill="#1C1917" />
    <circle cx="85" cy="81" r="1" fill="#FFFFFF" />
    <circle cx="117" cy="81" r="1" fill="#FFFFFF" />

    <!-- Nose / Sống mũi nhẹ -->
    <path d="M 99 82 L 97 93 L 102 94" fill="none" stroke="#D99B77" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Gentle smile / Nụ cười mỉm điềm đạm -->
    <path d="M 91 106 Q 100 112 109 106" fill="none" stroke="#A8573D" stroke-width="2" stroke-linecap="round" />

    <!-- Dispatch headset arc / Tai nghe điều phối viên du lịch -->
    <path d="M 68 82 C 64 68, 72 50, 96 46" fill="none" stroke="#78716C" stroke-width="1.75" stroke-linecap="round" />
    <rect x="62" y="80" width="6" height="12" rx="3" fill="#44403C" />
    <!-- Mic boom / Thanh mic nói -->
    <path d="M 64 88 Q 68 102 82 104" fill="none" stroke="#78716C" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="82" cy="104" r="2.5" fill="#44403C" />
  </g>

  <!-- Transparent badge / Nhãn công bố nhân vật giả lập -->
  <g transform="translate(100, 182)" filter="url(#avatar-shadow)">
    <rect x="-82" y="-12" width="164" height="22" rx="11" fill="#1C1917" stroke="#FAF8F5" stroke-width="1.5" />
    <text x="0" y="2.5" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#FAF8F5" text-anchor="middle" letter-spacing="0.3">
      Nhân vật điều phối giả lập
    </text>
  </g>
</svg>
