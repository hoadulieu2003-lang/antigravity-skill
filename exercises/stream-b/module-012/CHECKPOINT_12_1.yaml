asset_acquisition_plan: "Toàn bộ 14 tài sản đồ họa được sản xuất dưới dạng vector SVG nguyên bản tự kiến tạo cục bộ tại thư mục assets/ (gồm 6 icons 24x24, 2 sơ đồ lộ trình, 1 avatar nhân vật giả lập Lan, 3 đồ họa hiện trường/bản đồ và 2 texture nền). Đăng ký 100% trong ASSET_MANIFEST.yaml với origin_type: authored_vector và disclosure: 'Authored SVG vector asset simulating field scene for training exercise' kèm mã băm SHA-256 thực tế, 0 yêu cầu mạng từ xa (zero remote requests), tuân thủ ngân sách dưới 600KB/file và dưới 3.5MB tổng runtime."
