# TRIPFLOW BRAND & IMAGE DIRECTION CONTRACT (MODULE 12)
# Standard: DESIGN_TRAINING_MODULE_012_DIRECTIVE.md (Mục 14.4 & 17)
# Direction: Direction A (Human Field Intelligence)

contract_id: BRAND_IMAGE_CONTRACT_MODULE_012_R01
stream_id: B
module: DESIGN_TRAINING_012_BRAND_AND_IMAGE_DIRECTION
chosen_direction: DIRECTION_A
direction_name: "Human Field Intelligence (Trí tuệ Thực địa Nhân văn)"
version: "1.0.0"
status: ACTIVE_PRODUCTION

brand_identity:
  target_audience: "B2B SME Tour Dispatchers & Operational Teams"
  product_promise: "TRIPFLOW giúp đội vận hành nhìn thấy điều chưa sẵn sàng trước giờ khởi hành."
  personality_seed:
    - calm: "Bình tĩnh trước mọi biến cố và thay đổi lộ trình"
    - precise: "Chính xác từng dữ liệu phòng, xe, hướng dẫn viên và khách"
    - prepared: "Có chuẩn bị trước mọi điểm nghẽn với phương án dự phòng"
    - operator_empathy: "Gần gũi và thấu hiểu áp lực của nhân sự vận hành thực địa"
  anti_personality_locks:
    - no_luxury_travel_brochure: "Không phải hãng nghỉ dưỡng xa xỉ hay trang bán tour"
    - no_military_command_center: "Không thiết kế kiểu phòng điều khiển chiến dịch quân sự"
    - no_generic_glowing_ai: "Không dùng gradient tím-xanh neon hoặc AI phát sáng chung chung"
    - no_adventure_cliche: "Không dùng họa tiết la bàn, máy bay, đồi núi trang trí vô nghĩa"
    - no_vanity_metrics: "Không bịa đặt số liệu doanh thu, tăng trưởng hay đối tác thương mại"

