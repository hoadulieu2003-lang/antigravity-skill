      --color-status-attention-text: "var(--primitive-amber-700)"
      --color-status-attention-bg: "var(--primitive-amber-100)"
      --color-status-attention-border: "var(--primitive-amber-500)"

      --color-status-error-text: "var(--primitive-rose-700)"
      --color-status-error-bg: "var(--primitive-rose-100)"
      --color-status-error-border: "var(--primitive-rose-500)"

      --color-status-success-text: "var(--primitive-green-700)"
      --color-status-success-bg: "var(--primitive-green-100)"
