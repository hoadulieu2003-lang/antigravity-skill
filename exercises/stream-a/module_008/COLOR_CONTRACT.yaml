static_audit_invariants:
  rule_1_zero_primitive_in_component_selectors:
    description: "Component selectors in CSS must never reference --primitive-* directly."
    regex_pattern: "\\.(?:dispatch|badge|btn|table|card|tour|filter|fixture)[^{]*\\{[^}]*var\\(--primitive-[^)]+\\)"
    expected_matches: 0
    enforcement: "HARD_FAIL_ON_MATCH"

  rule_2_component_tokens_consume_semantic:
    description: "Component tokens defined on :root must reference var(--color-*) exclusively."
    regex_pattern: "--dispatch-[a-z0-9-]+:\\s*var\\(--color-[a-z0-9-]+\\)"
    enforcement: "REQUIRED_STRUCTURE"

  rule_3_brand_status_segregation:
    description: "Brand primary token must not be used as any operational status color."
    enforcement: "SEGREGATED_TOKENS"

  rule_4_operational_status_redundancy:
    description: "Every badge markup must include visible text copy and inline SVG with aria-hidden."
    required_elements:
      - "span.badge-text (Explicit Vietnamese string)"
      - "svg.status-icon[aria-hidden='true'][focusable='false']"
    enforcement: "HARD_FAIL_IF_MISSING"

# ------------------------------------------------------------------------------
# 9. FSM VERIFICATION CONTRACT (A03 / F03)
# Explicit machine-readable contract for asynchronous interactive state machine.
# ------------------------------------------------------------------------------
fsm_verification_contract:
  stable_action_selector: "#action-btn-tf802"
  initial_state: "IDLE"
  states:
    - "IDLE"
    - "VALIDATING"
    - "SAVING"
    - "FAILURE"
    - "CONFIRMED"
  allowed_transitions:
    IDLE:
      - "VALIDATING"
    VALIDATING:
      - "SAVING"
    SAVING:
      - "FAILURE"
      - "CONFIRMED"
    FAILURE:
      - "VALIDATING"
    CONFIRMED: []
  saving_guard:
    aria_disabled: "true"
    duplicate_activation_blocked: true
  no_steal_on_async_completion: true
  node_identity_rule: "SINGLE_STABLE_NODE_PRESERVED_ACROSS_ALL_STATES"

