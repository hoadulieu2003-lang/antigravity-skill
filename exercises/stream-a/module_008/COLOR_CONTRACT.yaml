# ------------------------------------------------------------------------------
# 6. THEME PROFILES (Option A, Option B, Candidate)
# Complete semantic mapping definitions for each visual direction.
# ------------------------------------------------------------------------------
theme_profiles:
  option_a:
    direction_id: "DIRECTION_A"
    direction_name: "Editorial Warm Dispatch (Sổ Cái Giấy Ấm)"
    thesis: >
      Warm Alabaster paper foundation (#FAF9F6) paired with deep Slate Ink (#0F172A),
      warm Amber keyboard focus ring (#D97706), and soft pastel status badges bounded
      by subtle, high-saturation 1px borders. Prioritizes visual calmness for long-form
      editorial review and administrative ledger logging.
    canvas_temperature: "Warm (Hue ~45deg, Alabaster #FAF9F6)"
    border_strategy: "1.0px subtle pastel / warm neutral borders"
    typography_stack: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    badge_border_width: "1.0px"
    semantic_mapping:
      --color-canvas-bg: "var(--primitive-warm-neutral-50)"
      --color-surface-bg: "var(--primitive-static-white)"
      --color-surface-subtle: "var(--primitive-warm-neutral-100)"
      --color-surface-raised: "var(--primitive-static-white)"

      --color-text-primary: "var(--primitive-slate-900)"
      --color-text-secondary: "var(--primitive-slate-600)"
      --color-text-muted: "var(--primitive-slate-500)"
      --color-text-inverse: "var(--primitive-static-white)"

      --color-border-subtle: "var(--primitive-slate-200)"
      --color-border-structural: "var(--primitive-slate-500)"
      --color-border-strong: "var(--primitive-slate-400)"

      --color-brand-primary: "var(--primitive-slate-900)"
      --color-brand-hover: "var(--primitive-slate-800)"
      --color-brand-active: "var(--primitive-slate-950)"
      --color-action-primary-bg: "var(--primitive-slate-900)"
      --color-action-primary-text: "var(--primitive-static-white)"
      --color-action-secondary-bg: "var(--primitive-static-white)"
