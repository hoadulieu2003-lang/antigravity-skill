    thesis: >
      Refined production release candidate based on Option A (Editorial Warm Dispatch).
      Harmonizes the soothing warm alabaster canvas with robust WCAG 2.2 AA contrast ratios,
      three redundant sensory layers on all operational badges, resilient asynchronous
      interaction FSM without focus eviction, and strict zero horizontal overflow across
      all responsive viewports.
    canvas_temperature: "Warm (Hue ~45deg, Alabaster #FAF9F6)"
    border_strategy: "1.0px subtle pastel / warm neutral borders"
    typography_stack: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    badge_border_width: "1.0px"
