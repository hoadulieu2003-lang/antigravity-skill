# ------------------------------------------------------------------------------
# 1. METADATA & DATA GOVERNANCE
# ------------------------------------------------------------------------------
governance:
  classification: "SYNTHETIC_TRAINING_FIXTURE"
  real_customer_data: false
  business_performance_claims: "none"
  notice_statement: >
    All dispatch ledger entries (TF-801 through TF-804) are synthetic training
    fixtures created solely for architectural evaluation and color system validation.
    No commercial performance, operational claim, or clinical ergonomics claim is made.
  invariants:
    theme: "LIGHT_THEME_DEFAULT_ONLY"
    motion: "ZERO_MOTION_UNTIL_STREAM_B_AUTHORIZES"
    overflow: "ZERO_HORIZONTAL_OVERFLOW_ALL_VIEWPORTS"
    accessibility_baseline: "WCAG_2_2_AA_BASELINE"

# ------------------------------------------------------------------------------
# 2. ARCHITECTURAL POLICIES & LOCKED CORRECTIONS (P01–P07)
# ------------------------------------------------------------------------------
policies:
  P01_state_taxonomy_segregation:
    operational_status_taxonomy:
      description: "Semantic classification of tour operational condition. Strictly domain status, NOT an interaction state machine."
      allowed_values:
        - "NORMAL"
        - "ATTENTION"
        - "ERROR"
        - "SUCCESS"
    interaction_fsm_states:
      description: "Asynchronous interaction state machine for user dispatch actions (e.g. task submission, retry, network sync)."
      allowed_values:
        - "IDLE"
        - "VALIDATING"
        - "SAVING"
        - "FAILURE"
        - "CONFIRMED"
    invariant: "Never merge tour operational status with button interaction FSM in a single state variable."

  P02_bounded_language_and_context:
    rule: "Avoid unproven empirical assertions. Label environmental claims as Design Hypotheses or Target Contexts."
    direction_a_hypothesis: "Target Context: Reduced luminance glare in extended indoor dispatch shifts via warm alabaster paper tones (#FAF9F6)."
    direction_b_hypothesis: "Target Context: Maximum boundary legibility and high contrast in ambient lighting environments via cool ice slate (#F8FAFC) and structural borders."

  P03_mathematical_contrast_compliance:
    luminance_formula: "W3C WCAG 2.2 sRGB Relative Luminance: L = 0.2126*R_lin + 0.7152*G_lin + 0.0722*B_lin"
    contrast_formula: "Contrast Ratio = (L1 + 0.05) / (L2 + 0.05), where L1 >= L2"
    thresholds:
      normal_text: 4.5
      large_text: 3.0
      ui_boundaries_and_focus: 3.0

  P04_token_provenance_architecture:
    hierarchy: "Primitive (--primitive-*) -> Semantic (--color-*) -> Component (--dispatch-*)"
    static_audit_rule: "Zero primitive tokens allowed inside component CSS rule selectors. Component classes consume component or semantic tokens exclusively."
    runtime_audit_rule: "Computed DOM styles must resolve to exact hex values declared in the token mapping."

  P05_substantive_direction_divergence:
    evaluation: "Divergence proven by distinct canvas temperatures, brand primary identity, border strategies, and visual theses. Arbitrary Delta L cutoffs are discarded."

  P06_color_independence_redundant_cues:
    requirement: "Every operational status must present 3 synchronized sensory layers:"
    layer_1_text: "Explicit Vietnamese copy ('Bình thường', 'Cần chú ý', 'Lỗi đối tác', 'Hoàn tất điều phối')."
    layer_2_geometry: "Standalone inline SVG shape with aria-hidden='true' and focusable='false' (Circle, Warning Triangle, Stop Octagon, Check Shield)."
    layer_3_color: "High-contrast semantic background, text, and border tokens satisfying WCAG 2.2 AA."
    simulation_review: "Grayscale inspection and CVD simulations (Deuteranopia, Protanopia via feColorMatrix) provided for Controller visual review."

  P07_context_aware_focus_verification:
    indicator_rule: "outline: 2px solid <color>; outline-offset: 2px; activated via native keyboard Tab traversal."
    contrast_requirement: "Contrast ratio >= 3.0:1 against immediate adjacent background."
    required_contexts:
      - "Primary Action CTA (Button)"
      - "Secondary Action / Filter Tab"
      - "Interactive Tour Row / Card"

