semantic_tokens:
  canvas_and_surface:
    --color-canvas-bg:
      description: "Default page background behind all ledger cards and containers."
      category: "surface"
    --color-surface-bg:
      description: "Surface background for tour cards, data tables, and modal dialogs."
      category: "surface"
    --color-surface-subtle:
      description: "Subtle background for table headers, inactive tabs, and synthetic fixture notice."
      category: "surface"
    --color-surface-raised:
      description: "Elevated surface for tooltips, dropdown menus, and floating action bars."
      category: "surface"
    --color-surface-hover:
      description: "Subtle interactive surface hover state for table rows and cards."
      category: "surface"
    --color-surface-shadow:
      description: "Subtle ambient shadow color for elevated cards."
      category: "surface"
    --color-surface-transparent:
      description: "Transparent surface background for outline/ghost elements."
      category: "surface"

  text:
    --color-text-primary:
      description: "Highest-contrast text for tour titles, ledger headers, and critical metrics."
      category: "text"
      min_contrast_target: 4.5
    --color-text-secondary:
      description: "Secondary text for coordinators, route notes, and metadata labels."
