        text:   "--color-status-error-text"
        bg:     "--color-status-error-bg"
        border: "--color-status-error-border"
      redundant_cues:
        vietnamese_label: "Lỗi đối tác"
        svg_shape: "stop-octagon"
        svg_role: "aria-hidden='true' focusable='false'"
    SUCCESS:
      description: "All services 100% confirmed by partners, tour file locked and archived."
      tokens:
        text:   "--color-status-success-text"
        bg:     "--color-status-success-bg"
        border: "--color-status-success-border"
      redundant_cues:
        vietnamese_label: "Hoàn tất điều phối"
        svg_shape: "check-shield"
        svg_role: "aria-hidden='true' focusable='false'"

  interaction_fsm_states:
    IDLE:
      description: "Standard quiescent state. Controls fully interactive."
      opacity: 1.0
      cursor: "pointer"
      aria_disabled: "false"
      aria_busy: "false"
      focus_behavior: "Normal Tab order"
      announcer: "Silent"
    VALIDATING:
      description: "Client-side pre-flight parameter verification."
      opacity: 0.85
      cursor: "wait"
      aria_disabled: "true"
      aria_busy: "true"
      focus_behavior: "Preserved on trigger element (never evicted to body)"
      announcer: "Đang kiểm tra tham số điều phối..."
    SAVING:
      description: "Asynchronous network dispatch to partner booking services."
      opacity: 0.75
      cursor: "not-allowed"
      aria_disabled: "true"
      aria_busy: "true"
      focus_behavior: "Preserved on trigger element via aria-disabled without HTML disabled"
      announcer: "Đang đồng bộ dữ liệu với hệ thống điều phối..."
    FAILURE:
      description: "Network timeout or partner rejection. Action failed."
      opacity: 1.0
      cursor: "pointer"
      aria_disabled: "false"
      aria_busy: "false"
      focus_behavior: "Single stable action node preserved in DOM without replacement; focus remains on trigger element without focus stealing"
      announcer: "Lỗi kết nối đối tác. Vui lòng bấm Thử lại."
    CONFIRMED:
      description: "Action committed successfully. Tour status updated."
      opacity: 1.0
      cursor: "default"
      aria_disabled: "false"
      aria_busy: "false"
      focus_behavior: "Single stable action node updated in-place; no focus stealing if user moved focus to another element"
      announcer: "Thao tác điều phối đã được xác nhận thành công."

# ------------------------------------------------------------------------------
# 5. TIER 3: COMPONENT TOKENS (--dispatch-*)
# Scoped specifically to UI components.
# Strict Invariant: MUST reference Semantic Tokens (--color-*), NEVER Primitive Tokens!
# ------------------------------------------------------------------------------
component_tokens:
  card_container:
    --dispatch-card-bg: "var(--color-surface-bg)"
