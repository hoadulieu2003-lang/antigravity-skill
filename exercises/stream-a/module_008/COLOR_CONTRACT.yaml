      --color-text-emphasized: "var(--primitive-slate-900)"

  option_b:
    direction_id: "DIRECTION_B"
    direction_name: "Technical Slate High-Contrast (Bảng Giám Sát Kỹ Thuật)"
    thesis: >
      Cool Ice Slate foundation (#F8FAFC) paired with vibrant Technical Indigo (#3730A3),
      electric Cobalt keyboard focus ring (#2563EB), and high-contrast status badges
      bounded by bold 1.5px structural borders. Engineered for mission-critical
      monitoring, high ambient illumination readability, and rapid scannability.
    canvas_temperature: "Cool (Hue ~215deg, Ice Slate #F8FAFC)"
    border_strategy: "1.5px bold structural borders, zero soft shadows"
    typography_stack: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace (for codes/metrics) and Inter, system-ui, sans-serif"
    badge_border_width: "1.5px"
    semantic_mapping:
      --color-canvas-bg: "var(--primitive-slate-50)"
      --color-surface-bg: "var(--primitive-static-white)"
