module: DESIGN_TRAINING_005
selected_direction: B
status: ACCEPTED_FOR_EXERCISE
final_verdict_ref: DESIGN_TRAINING_005_FINAL_REVIEW_002.md
thesis: "Sử dụng trục căn lề trái nghiêm ngặt kết hợp cặp phông Sans-serif mô-đun và Monospace kỹ thuật nhằm biến thông tin bàn giao thành các khối dữ liệu đối chiếu chuẩn xác, giúp người phụ trách sản phẩm nhận diện tức thì tình trạng công việc mà không bị phân tán thị giác."
audience: "Người phụ trách sản phẩm hoặc vận hành doanh nghiệp nhỏ"
perception_goals:
  - "Rõ ràng: Dữ liệu và trạng thái bàn giao được tách bạch minh bạch trên từng hàng đối chiếu (mục tiêu cảm nhận, chưa phải đo lường người dùng)."
  - "Có chủ đích: Mọi đường hairline, tỷ lệ spacing và badge trạng thái đều phục vụ giả thuyết quét thông tin nhanh."
  - "Đáng tin: Cấu trúc mô-đun vững chắc, không hiệu ứng hào nhoáng thừa thãi, thể hiện sự nghiêm túc của công cụ sản phẩm."
  - "Có nét riêng: Bản sắc kỹ thuật sắc nét (technical precision) với điểm nhấn Sky/Cyan và hệ thống nhãn monospace."
typography:
  families:
    - primary: "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif (Ứng viên Inter đầu stack, fallback hệ thống offline)"
    - secondary: "ui-monospace, 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace (Ứng viên SF Mono đầu stack, fallback hệ thống offline)"
  roles:
    heading_display: "Inter / 800 weight / clamp(2.25rem, 4vw, 3rem) / line-height 1.15 / tracking -0.03em"
    body_lead: "Inter / 400 weight / 1.125rem / line-height 1.6 / color #475569"
    metadata_mono: "SF Mono / 600 weight / 0.8125rem / uppercase / tracking 0.06em / color #0284C7"
    data_cell: "Inter / 600 weight / 0.9375rem (desktop), 1rem (mobile) / color #0F172A"
