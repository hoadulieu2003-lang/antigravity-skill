composition:
  alignment: "Trục căn lề trái nhất quán (Strict Left-Aligned Datum Axis), khóa chặt mối quan hệ giữa nhãn, tiêu đề, nút bấm và bảng dữ liệu."
  hierarchy: "Nhãn ngữ cảnh monospace -> Tiêu đề chính h1 -> Đoạn dẫn nhập -> Cặp nút CTA -> Bản mẫu dữ liệu đối chiếu 3 dòng."
image_direction:
  purpose: "Bản mẫu giao diện tĩnh đóng vai trò bằng chứng kiến trúc thực tế, mô phỏng bảng ma trận bàn giao để người xem đối chiếu trực quan 3 dòng dữ liệu (Yêu cầu sản phẩm, Bản mẫu đăng nhập, Biên bản bàn giao) trong cùng một ngữ cảnh."
signature_decision: "Bố trí bảng dữ liệu bàn giao với tiêu đề khung công cụ 'MODULE 01: TRACE SPECIMEN' và nhãn rõ ràng 'BẢN MẪU TĨNH', biến bản mẫu từ một hình ảnh minh họa thụ động thành một giao diện công cụ đo đạc có cấu trúc kỹ thuật trực quan mà không tạo hiểu lầm về dữ liệu thời gian thực."
avoid:
  - "Tránh nền tối (Dark theme) trong bài tập này vì TRACE được định hướng giao diện sáng nhằm phục vụ sự tập trung cao độ của người làm vận hành doanh nghiệp nhỏ; đây là lựa chọn có điều kiện của dự án, không áp đặt thành quy luật chung cho mọi sản phẩm."
  - "Tránh các hiệu ứng chuyển động (animations, transitions, smooth scroll) theo yêu cầu kỹ thuật Zero Motion đã khóa của bài tập; phục vụ việc hiển thị tức thì và chính xác dữ liệu đối chiếu."
  - "Tránh thu nhỏ bảng dữ liệu thành hình ảnh chữ li ti không đọc được trên màn hình hẹp (mobile)."
responsive:
  mobile_changes:
    - "Chuyển đổi lưới hero 2 cột ngang (desktop 1440px) thành 1 cột dọc (mobile 390px) theo trật tự tự nhiên: Nội dung dẫn nhập trước, Bảng đối chiếu theo sau."
    - "Bảng dữ liệu thích ứng trên mobile: Tên tài liệu chiếm trọn 100% chiều ngang dòng đầu với font 1rem (16px), dòng thứ hai hiển thị Người phụ trách và Badge trạng thái song song; không co hẹp hay bẻ vụn chữ."
    - "Cặp nút CTA mở rộng toàn chiều ngang (100% width) trên mobile để tạo vùng bấm ngón tay thuận tiện (touch target >= 44px)."
motion: none
